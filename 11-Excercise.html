<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Design the following HTML Design</h2>
    <fieldset>
      <legend>Registration Page</legend>
      <form align="center" action="#">
        <p>
          <label for="employeename">Employee Name:</label>
          <input type="employeename" name="employeename" />
        </p>

        <label for="job">Job:</label>
        <select name="job" id="job" multiple>
          <option value="Saleman">Saleman</option>
          <option value="Manager">Manager</option>
          <option value="Clerk">Clerk</option>
          <option value="Analyst">Analyst</option>
        </select>
        <p>
          <label for="email">email:</label>
          <input type="email" name="email" />
        </p>
        <p>
          <label for="password">Password:</label>
          <input type="password" name="password" />
        </p>
        <p>
          <label for="re-password">re-Password:</label>
          <input
            type="password"
            name="re-password"
            placeholder="Comfirm Your Password"
          />
        </p>
        <p>
          <label for="gender">Gender:</label>
          <label for="male">Male</label>
          <input type="radio" name="gender" id="male" value="male" />

          <label for="female">Female</label>
          <input type="radio" name="gender" id="gender" value="gender" />
        </p>
        <p>
          <label for="birthday">Birthday</label>
          <input type="date" name="birthday" id="birthday" />
        </p>
        <p>
          <label for="salary">Salary</label>
          <input type="number" name="salary" id="salary" />
        </p>
        <p>
          <label for="commission">commission:</label>
          <input type="text" />
        </p>
        <p>
          <label for="total salary">Total Salary:</label>
          <input type="number" name="total salary" id="total salary" />
        </p>
        <button>submit</button>
        <button>reset</button>
      </form>
    </fieldset>
  </body>
</html>
